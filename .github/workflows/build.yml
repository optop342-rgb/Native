name: Build Native Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download and Setup Preloader SDK
      run: |
        git clone --no-checkout https://github.com/LiteLDev/preloader-android.git preloader_sdk
        git -C preloader_sdk fetch --depth 1 origin 5d108da350ce3e7f13f51415f81e65344ecd5d14
        git -C preloader_sdk checkout --detach FETCH_HEAD

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'ndk;26.1.10909125 cmake;3.22.1'

    - name: Build with CMake
      run: |
        cmake -S ResistanceLab -B ResistanceLab/build \
          -DPRELOADER_SDK_ROOT="$GITHUB_WORKSPACE/preloader_sdk" \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DANDROID_ALLOW_UNDEFINED_SYMBOLS=ON \
          -DANDROID_STL=c++_static \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build ResistanceLab/build -j$(nproc)

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ResistanceLab-Build
        path: ResistanceLab/build/libresistance_lab.so
        if-no-files-found: error
