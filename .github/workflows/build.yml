name: Build Native Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip ResistanceLab
      run: |
        if [ -f "ResistanceLab.zip" ]; then
          unzip -q ResistanceLab.zip -d ResistanceLab_Build
        else
          echo "Error: ResistanceLab.zip not found!"
          exit 1
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'ndk;26.1.10909125 cmake;3.22.1'

    - name: Build with CMake
      run: |
        cd ResistanceLab_Build
        # CMake ko exact path batao
        cmake -S . -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24
          
        # Build karo
        cmake --build build -j$(nproc)

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ResistanceLab-Build
        path: ResistanceLab_Build/build/**/*.so
        if-no-files-found: error
